pipeline.bootstrap-servers=${SENTINELPAY_KAFKA_SERVERS:localhost:9092}
pipeline.jdbc-url=${SENTINELPAY_DB_URL:jdbc:postgresql://localhost:5432/sentinelpay}
pipeline.username=${SENTINELPAY_DB_USER:sentinelpay}
pipeline.password=${SENTINELPAY_DB_PASSWORD:}
pipeline.topic=sentinelpay.payments.v1
pipeline.dead-letter-topic=sentinelpay.payments.v1.dlt
pipeline.group-id=sentinelpay-storage-v1
pipeline.partitions=3
server.address=127.0.0.1

# Local AI is opt-in. No model is downloaded automatically.
incident.ai.enabled=${SENTINELPAY_AI_ENABLED:false}
incident.ai.model=${SENTINELPAY_AI_MODEL:}

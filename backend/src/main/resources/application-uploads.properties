server.port=${PORT:8083}
uploads.supabase-url=${SUPABASE_URL}
uploads.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5173}
uploads.jdbc-url=${UPLOADS_JDBC_URL}
uploads.username=${UPLOADS_DB_USER}
uploads.password=${UPLOADS_DB_PASSWORD}
uploads.migrations-enabled=${UPLOADS_MIGRATIONS_ENABLED:true}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
server.tomcat.threads.max=20
server.tomcat.max-part-count=2
server.error.include-message=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
